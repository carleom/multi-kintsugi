name: Theme consistency

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Neovim for highlight checks
        run: |
          curl -fL https://github.com/neovim/neovim/releases/download/v0.11.5/nvim-linux-x86_64.tar.gz -o "$RUNNER_TEMP/nvim.tar.gz"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Build pinned parsers for required fixture tests
        run: python3 scripts/install-test-parsers.py "$RUNNER_TEMP/kintsugi-runtime"
      - name: Check generated ports
        run: python3 scripts/sync-themes.py --check
      - name: Test semantic mappings and resolved highlights
        env:
          KINTSUGI_PARSER_RUNTIME: ${{ runner.temp }}/kintsugi-runtime
          KINTSUGI_REQUIRE_PARSERS: "1"
        run: python3 -m unittest discover -s tests -v
